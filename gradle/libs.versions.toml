[versions]
agp = "8.9.2"
kotlin = "2.4.21"
composeVersion = "1.13.0-beta01"
compose-material3 = "1.8.2"
coroutines = "1.10.2"
datetime = "0.6.2"
serialization = "1.8.1"
ktor = "3.1.3"
androidx-activity = "1.10.1"
androidx-lifecycle = "2.8.4"
napier = "2.7.1"
nucleus-pdfium = "158.0.8111.0"
markdown-renderer = "0.43.0"
jlatexmath = "1.0.7"
datastore = "1.1.2"
koog-agents = "1.3.0"
koog-agents-additions = "1.3.0-beta"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeVersion" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeVersion" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "composeVersion" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeVersion" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeVersion" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
napier = { module = "io.github.aakira:napier", version.ref = "napier" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog-agents" }
koog-agents-additions = { module = "ai.koog:koog-agents-additions", version.ref = "koog-agents-additions" }
koog-http-client-ktor = { module = "ai.koog:http-client-ktor", version.ref = "koog-agents" }
nucleus-pdfium = { module = "dev.nucleusframework:pdfium", version.ref = "nucleus-pdfium" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
markdown-renderer-coil3 = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "markdown-renderer" }
markdown-renderer-core = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "markdown-renderer" }
jlatexmath = { module = "org.scilab.forge:jlatexmath", version.ref = "jlatexmath" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeVersion" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
