name: Build PaperConnekt

on:
  pull_request:
  push:
    branches:
      - main
      - contest/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperconnekt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Gradle checks and JVM/web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks and build JVM/web distributions
        run: >
          ./gradlew --no-daemon
          check
          :app:desktop:packageUberJarForCurrentOS
          :app:web:wasmJsBrowserDistribution
          :app:webServer:installDist

      - name: Upload JVM and web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperconnekt-jvm-web
          if-no-files-found: error
          path: |
            app/desktop/build/compose/binaries/main/**
            app/web/build/dist/**
            app/webServer/build/install/**

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:android:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: paperconnekt-android-debug
          if-no-files-found: error
          path: app/android/build/outputs/apk/debug/*.apk

  vscode:
    name: VS Code extension package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install extension tooling
        working-directory: plugin/vscode
        run: npm install --no-audit --no-fund

      - name: Package extension
        working-directory: plugin/vscode
        run: npm run package

      - name: Upload VS Code extension
        uses: actions/upload-artifact@v4
        with:
          name: paperconnekt-vscode
          if-no-files-found: error
          path: plugin/vscode/*.vsix
