<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d47a1">
    <title>PaperConnekt</title>
    <style>
        html, body, #paperconnekt {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
    <script>
        const nativeLanguages = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        const nativeLanguage = Object.getOwnPropertyDescriptor(Navigator.prototype, "language");
        Object.defineProperty(Navigator.prototype, "languages", {
            ...nativeLanguages,
            get: function () {
                return window.__customLocale
                    ? [window.__customLocale]
                    : nativeLanguages.get.apply(this);
            }
        });
        Object.defineProperty(Navigator.prototype, "language", {
            ...nativeLanguage,
            get: function () {
                return window.__customLocale || nativeLanguage.get.apply(this);
            }
        });
    </script>
    <script type="module" src="paperconnekt.js"></script>
</head>
<body>
<div id="paperconnekt"></div>
</body>
</html>
